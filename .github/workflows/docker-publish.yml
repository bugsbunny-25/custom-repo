name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    # Immutable version tags. Pushing `v1.2.3` publishes :v1.2.3, :v1.2 and
    # :v1 alongside :main, so the homelab quadlet can pin a tag that never
    # moves and roll back by editing one line. See docs/integration-spec.md.
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # One job per architecture, each on a runner of that architecture, pushing an
  # image *by digest only* (no tag). The `merge` job below then stitches those
  # digests into a single multi-arch manifest list under the real tags.
  #
  # Why native runners rather than one job with `platforms: linux/amd64,linux/arm64`:
  # that form cross-builds the non-native arch under QEMU, and this image's build
  # is a full Gradle compile plus an Android SDK install - emulated, the arm64 leg
  # takes hours and routinely hits the job timeout. `ubuntu-24.04-arm` is a real
  # arm64 runner (free for public repos), so each leg builds natively at roughly
  # the speed the amd64 build already ran at, in parallel.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      # "linux/arm64" -> "linux-arm64", for artifact names (slashes aren't allowed).
      - name: Prepare platform slug
        run: echo "PLATFORM_SLUG=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      # Required for the --secret build mount used by the Dockerfile.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only here - tags are applied once, by the merge job, to the
      # manifest list rather than to each per-arch image.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `type=sha` gives every build a pinnable :sha-<short> tag; the
          # semver rules only fire on a v* tag push, and `main` keeps being
          # the moving tag that `podman auto-update` follows.
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # push-by-digest: publish the per-arch image with no tag of its own,
          # returning its digest for the merge job. name-canonical keeps the
          # image's own name field pointing at the canonical repository.
          # oci-mediatypes=false is load-bearing, not cosmetic. Buildx
          # pushes OCI media types by default, and the OCI image config spec
          # has no Healthcheck field - so although BuildKit does write the
          # HEALTHCHECK into the config blob, Podman parses an OCI-typed
          # image through a struct that has nowhere to put it and drops it.
          # The result is a published image whose health check exists in the
          # registry and is invisible to the runtime that pulls it
          # (containers/podman#18904), which is why the quadlet needed its
          # own HealthCmd as a workaround. Docker media types keep it.
          outputs: type=image,oci-mediatypes=false,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Buildx attaches provenance/SBOM attestations by default, each
          # pushed as its own manifest referenced by digest (sha256-<digest>)
          # rather than by the tags above - disable both so GHCR's tag list
          # only shows the tags metadata-action actually generated.
          provenance: false
          sbom: false
          # Cache per platform so the two legs don't evict each other's layers.
          cache-from: type=gha,scope=${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_SLUG }}
          # morphe-patcher is resolved from GitHub Packages at build time,
          # which requires authentication even for public packages - reuse
          # this workflow's own token (any authenticated account can read a
          # public GHP package; it does not need access to MorpheApp/morphe-patcher).
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      # Hand the digest to the merge job as a zero-byte file named after it,
      # so the merge job can reconstruct the full list without needing outputs
      # from a matrix (which would collapse to a single value).
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          # The filename is the digest with its "sha256:" prefix stripped:
          # upload-artifact rejects a colon in any path it uploads, and the
          # merge job re-adds the prefix when it rebuilds the references
          # ("...@sha256:%s"). Keep the two in step.
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Builds the image for this runner's architecture only, loads it into the
  # local daemon, and exercises it. This is the job that would have caught the
  # change this slim-down nearly shipped: moving the runtime to a `-jre` base
  # removes `jar`/`jarsigner`, which breaks index signing at publish time -
  # not at start-up - so the container still goes healthy and auto-update
  # still promotes it, while clients quietly stop seeing updates.
  #
  # It runs on pull requests as well as pushes, deliberately: catching it
  # after the image is published to :main is too late.
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: custom-repo:smoke-test
          provenance: false
          sbom: false
          cache-from: type=gha,scope=linux-amd64
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: ./scripts/smoke-test.sh custom-repo:smoke-test

  # Combines the per-arch digests into one tagged manifest list, so
  # `docker pull`/`container pull` of a tag resolves to the right architecture.
  merge:
    needs: [build, smoke-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `type=sha` gives every build a pinnable :sha-<short> tag; the
          # semver rules only fire on a v* tag push, and `main` keeps being
          # the moving tag that `podman auto-update` follows.
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha,prefix=sha-,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # The HEALTHCHECK is what lets `podman auto-update` reject an image
      # whose app starts but does not work, so "it is in the Dockerfile" is
      # not enough - it has to survive being published. This asserts it is
      # actually present in the pushed per-platform config, and that the
      # manifests are Docker-typed, since an OCI-typed image is exactly the
      # case where Podman silently ignores it.
      - name: Verify the published image kept its HEALTHCHECK
        run: |
          set -euo pipefail
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"

          # Asserting media types, not just the presence of the field. The
          # config blob keeps Healthcheck either way - it was verified
          # present on an OCI-typed image that Podman nonetheless ignored -
          # so "the field is there" proves nothing on its own. Docker-typed
          # manifests are what make the runtime read it.
          raw=$(docker buildx imagetools inspect "$ref" --raw)
          media=$(jq -r '.mediaType' <<<"$raw")
          echo "index mediaType: $media"
          if [ "$media" != "application/vnd.docker.distribution.manifest.list.v2+json" ]; then
            echo "::error::index is $media, not a Docker manifest list - Podman will drop the HEALTHCHECK"
            exit 1
          fi
          bad=$(jq -r '[.manifests[] | select(.mediaType != "application/vnd.docker.distribution.manifest.v2+json") | .mediaType] | join(", ")' <<<"$raw")
          if [ -n "$bad" ]; then
            echo "::error::non-Docker per-platform manifest(s): $bad"
            exit 1
          fi

          # One entry per platform; every one must declare a health check.
          configs=$(docker buildx imagetools inspect "$ref" --format '{{json .Image}}')
          missing=0
          for platform in $(jq -r 'if has("config") then "single" else keys[] end' <<<"$configs"); do
            if [ "$platform" = "single" ]; then
              test_cmd=$(jq -r '.config.Healthcheck.Test // empty' <<<"$configs")
            else
              test_cmd=$(jq -r --arg p "$platform" '.[$p].config.Healthcheck.Test // empty' <<<"$configs")
            fi
            if [ -z "$test_cmd" ]; then
              echo "::error::$platform: published image has no Healthcheck"
              missing=1
            else
              echo "$platform: Healthcheck present"
            fi
          done
          exit $missing
