[versions]
kotlin = "2.4.10"
ktor = "3.5.2"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
snakeyaml = "2.6"
# Bumped together as a coupled pair (see original comment history):
# Exposed 1.x introduces the org.jetbrains.exposed.v1.* package layout
# (v1.core.* for table/column/expression types, v1.jdbc.* for Database,
# SchemaUtils, transaction and the DML extension functions). All three
# call-sites (AppConfig.kt, AppDatabase.kt, Schema.kt) were migrated in lock
# step. sqlite-jdbc was also bumped to the current release at the same time.
sqlite-jdbc = "3.53.2.0"
exposed = "1.1.1"
jsoup = "1.23.1"
# logback 1.6.x is a drop-in replacement for 1.5.x and works with SLF4J 2.0.x
# (the note about needing 2.1.x was incorrect - see logback.qos.ch/news.html).
# Our logback.xml uses no Janino conditionals so no config migration is needed.
logback = "1.6.1"
slf4j = "2.0.18"
junit = "6.1.2"
mockk = "1.14.11"
# Pinned to the exact version morphe-desktop main currently depends on
# (confirmed against its gradle/libs.versions.toml at tag v1.15.1, the commit
# recorded in app/src/main/kotlin/app/morphe/engine/FORK_INFO). The vendored
# `app.morphe.engine` package is compiled against this patcher, so the two move
# together: bumping one without re-checking the other is how you get
# NoSuchMethodError at patch time.
#
# Keeping it in lock step with morphe-desktop also keeps us on the same patcher
# generation the .mpp bundles are built for. PatcherCompatibility reads a
# bundle's `Patcher-Version` manifest attribute and refuses (with a clear
# message) anything built against a newer patcher than we ship - the same check
# morphe-manager does - so falling behind shows up as an explicit "needs patcher
# X, this build ships Y" rather than a cryptic link error.
#
# When bumping: re-read morphe-desktop's catalog, then re-check the Patch /
# Option / PatcherConfig / PackageMetadata API surface the engine and
# app.fdroidserver.patching call into.
morphe-patcher = "1.14.1"
arsclib = "1.4.0"
shadow = "9.6.1"

[libraries]
arsclib = { module = "com.github.REAndroid:ARSCLib", version.ref = "arsclib" }
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
# Lets PatchSourceSchedulerTest drive the vendored engine's real GitHub and
# GitLab sources against canned HTTP responses, so the provider-specific URL
# shapes and JSON normalization are actually exercised instead of mocked away.
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
# The vendored engine (and morphe-patcher itself) logs through java.util.logging;
# this bridge is installed in Main/PatchWorkerEntryPoint so those records reach
# logback like every app.fdroidserver logger instead of going to JUL's own
# unconfigured console handler.
jul-to-slf4j = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
