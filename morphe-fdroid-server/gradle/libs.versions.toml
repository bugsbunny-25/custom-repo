[versions]
kotlin = "2.4.10"
ktor = "3.5.2"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
snakeyaml = "2.6"
# Bumped together as a coupled pair (see original comment history):
# Exposed 1.x introduces the org.jetbrains.exposed.v1.* package layout
# (v1.core.* for table/column/expression types, v1.jdbc.* for Database,
# SchemaUtils, transaction and the DML extension functions). All three
# call-sites (AppConfig.kt, AppDatabase.kt, Schema.kt) were migrated in lock
# step. sqlite-jdbc was also bumped to the current release at the same time.
sqlite-jdbc = "3.53.2.0"
exposed = "1.1.1"
jsoup = "1.23.1"
# logback 1.6.x is a drop-in replacement for 1.5.x and works with SLF4J 2.0.x
# (the note about needing 2.1.x was incorrect - see logback.qos.ch/news.html).
# Our logback.xml uses no Janino conditionals so no config migration is needed.
logback = "1.6.1"
slf4j = "2.0.18"
junit = "6.1.2"
mockk = "1.14.11"
# Pinned to the exact version morphe-cli main currently depends on (confirmed
# via its gradle/libs.versions.toml). 1.7.0 introduced PathOptionsKt (typed
# option constructors: colorOption, filePathOption, filesOption, folderOption,
# imageOption) plus new Option subclasses (ColorOption, FilePathOption,
# FilesOption, FolderOption, ImageOption, StringOption, ImageSize). Patches
# compiled against 1.7.0+ reference PathOptionsKt at class-init time, so the
# server must bundle at least 1.7.0 or loading those .mpp files will throw
# ClassNotFoundException: app.morphe.patcher.patch.PathOptionsKt.
# Bump only after re-checking morphe-cli's currently pinned version and the
# real Patch/Option API surface, per plan.md §5.1/§9.3.
morphe-patcher = "1.7.0"
arsclib = "1.4.0"
shadow = "9.6.1"

[libraries]
arsclib = { module = "com.github.REAndroid:ARSCLib", version.ref = "arsclib" }
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
