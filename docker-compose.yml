version: '3.8'

services:
  fdroid-repo:
    image: ghcr.io/bugsbunny-25/custom-repo:main
    container_name: fdroid-repo
    restart: unless-stopped

    # No container-wide mem_limit, and no JVM resource flags in
    # supervisord.conf either - both the admin-server JVM and the short-lived
    # patch-worker JVM spawned per job (see PatchWorkerLauncher) size
    # themselves the way the JVM normally does, against whatever memory they
    # see. On a large host that means a large default heap even when idle.
    #
    # mem_limit is the one place worth setting if you want a ceiling: the JVM
    # reads the cgroup limit, so one value here bounds both processes instead
    # of hard-coding heap sizes per process.
    #
    # Careful with the number. With no -Xmx a JVM takes 25% of what it can see,
    # so a limit is roughly 4x the usable heap: mem_limit 1g gives the patcher a
    # 256m heap and a YouTube-class patch dies of OutOfMemoryError with the
    # container still ~140 MiB short of full. Measured on YouTube 21.36.45 with
    # 81 patches: 2g works, 1.5g fails, worker RSS peaks at ~1.76 GiB when given
    # room. 3g is the comfortable choice.
    #
    # See README.md "Memory and resource limits" for the full measurements,
    # both failure modes, and how to shrink only the admin server's idle
    # footprint without starving patch runs.
    # mem_limit: 3g

    volumes:
      # Persist the F-Droid repository data
      - ${CONFIG_FOLDER}/fdroid-data/:/srv/fdroid

      # Persist the SQLite database (all app settings, GitHub repos, patch
      # library/targets, checked-release history). Everything is configured
      # through the admin UI's Settings page after first run - there's no
      # config.yml to hand-edit anymore.
      - ${CONFIG_FOLDER}/db:/app/db

      # Optional: persist logs
      - ${CONFIG_FOLDER}/logs:/var/log

    environment:
      - TZ=UTC
      # Root log level for the app (logback.xml reads this, defaulting to
      # INFO if unset). One of ERROR, WARN, INFO, DEBUG, TRACE.
      - LOG_LEVEL=INFO
      # Override for a different DB directory; defaults to /app/db (the
      # app.db file is created inside it automatically if missing)
      # - DB_PATH=/app/db
    
    # Expose port (will be proxied by your nginx reverse proxy)
    ports:
      - "8080:80"  # Change 8080 to your preferred port
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
