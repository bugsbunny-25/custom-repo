[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log
priority=1

; Replaces the old three Python processes (config-ui, fdroid-updater,
; patch-checker) - the admin server and both scheduler loops (GitHub
; releases, APKMirror patching) now run as coroutines inside this one JVM
; process (see morphe-fdroid-server/app/src/main/kotlin/app/fdroidserver/Main.kt).
; morphe-patcher is a normal Gradle dependency merged into app.jar's own
; shadow/fat jar (see morphe-fdroid-server/app/build.gradle.kts) - no second
; jar on the classpath.
;
; Heap is capped explicitly (-Xmx) instead of leaning on the JVM default of
; 25% of host RAM - with no container memory limit the JVM would otherwise
; reserve ~2GB idle on a large host. 512m (not 256m) leaves headroom for the
; in-JVM APK patch/sign pipeline, which is memory-spiky. SerialGC has a
; smaller native footprint than the G1 default for this small-heap,
; low-traffic workload; metaspace + direct memory are capped and Netty uses
; the unpooled allocator to keep the off-heap floor down.
; MALLOC_ARENA_MAX=2 curbs glibc's per-CPU malloc arenas, a common source of
; inflated JVM native RSS in containers on many-core hosts.
[program:fdroid-server]
command=java -Xmx512m -Xms64m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Dio.netty.allocator.type=unpooled -XX:MaxDirectMemorySize=64m -jar /app/app.jar
environment=MALLOC_ARENA_MAX=2
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/fdroid-server.log
stderr_logfile=/var/log/supervisor/fdroid-server_error.log
priority=2
