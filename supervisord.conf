[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log
priority=1

; Replaces the old three Python processes (config-ui, fdroid-updater,
; patch-checker) - the admin server and both scheduler loops (GitHub
; releases, APKMirror patching) now run as coroutines inside this one JVM
; process (see morphe-fdroid-server/app/src/main/kotlin/app/fdroidserver/Main.kt).
; morphe-patcher is a normal Gradle dependency merged into app.jar's own
; shadow/fat jar (see morphe-fdroid-server/app/build.gradle.kts) - no second
; jar on the classpath.
;
; Started with no JVM resource flags at all: no -Xmx/-Xms, no metaspace or
; direct-memory cap, the default (G1) collector, Netty's default pooled
; allocator, and glibc's default malloc arenas. The JVM sizes itself the way
; it normally does - a fraction of whatever memory it sees, cgroup limit if
; the container has one, host RAM otherwise - which is also how the patch
; worker JVM has always run (see PatchWorkerLauncher in
; app/src/main/kotlin/app/fdroidserver/patching/PatchWorker.kt).
;
; Trade-off to be aware of: on a large host with no container memory limit
; this process will reserve a far bigger heap when idle than the previous
; 512m cap allowed. If you want a ceiling, set `mem_limit` on the service in
; docker-compose.yml - the JVM reads the cgroup limit and sizes itself
; against that, which bounds both this process and the patch worker in one
; place rather than hard-coding numbers here.
[program:fdroid-server]
command=java -jar /app/app.jar
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/fdroid-server.log
stderr_logfile=/var/log/supervisor/fdroid-server_error.log
priority=2
