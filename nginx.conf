# ---------------------------------------------------------------------------
# Only the documented paths are served.
# ---------------------------------------------------------------------------
# This file used to set `root /srv/fdroid` together with a catch-all
#   location / { autoindex on; }
# which served *every* file under the repo data directory. That included
# `keystore.p12`, `patched-keystore.jks`, `patched-tv-keystore.jks` and
# `config.yml` - and config.yml holds `keystorepass`/`keypass` in plaintext.
# Anyone who could reach the container (and, via the SWAG proxy, anyone on the
# internet) could fetch the repo signing key and its password and publish APKs
# that every subscribed client would accept as genuine.
#
# So the catch-all is gone. Each public path is now listed explicitly and
# everything else returns 404. The paths below are exactly the ones the repo
# is contracted to serve, plus the `archive` repos, which the old catch-all
# was also serving and which an F-Droid client may have added as its own repo.
#
# Keeping this list in step with the data layout matters: a new public
# directory under /srv/fdroid will NOT be served until it is added here.

server {
    listen 80 default_server;
    server_name _;

    # No `root` at the server level on purpose: without it, a path that
    # matches no location below cannot resolve to a file on disk.

    # Allow large .mpp patch uploads (default is 1m, which causes 413s).
    # Only /api/ accepts uploads; the static locations are read-only.
    client_max_body_size 200M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security headers (also inherited by the locations below).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ---- F-Droid repositories -------------------------------------------
    # index-v1.jar / index-v2.json / entry.jar and the APKs themselves.
    # `alias` rather than `root` so the URL prefix and the on-disk directory
    # stay independent.
    location /repo {
        alias /srv/fdroid/repo;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The archive repo (older versions rotated out of /repo by
    # `archive_older`). Bounded by ARCHIVE_KEEP - see the app's archive
    # pruning - but still served, because a client may subscribe to it
    # directly.
    location /archive {
        alias /srv/fdroid/archive;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The separate patched-apps repository.
    location /patched/repo {
        alias /srv/fdroid/patched/repo;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /patched/archive {
        alias /srv/fdroid/patched/archive;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The separate patched-tv-apps repository (independent from
    # /patched/repo above - mobile and TV builds share package names so they
    # can't live in the same repo).
    location /patched-tv/repo {
        alias /srv/fdroid/patched-tv/repo;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /patched-tv/archive {
        alias /srv/fdroid/patched-tv/archive;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Repo icons.
    location /icons {
        alias /srv/fdroid/repo/icons;
        autoindex on;
        add_header X-Content-Type-Options nosniff always;
    }

    # ---- Admin UI and API -----------------------------------------------
    location /admin {
        proxy_pass http://127.0.0.1:5001/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A patch run triggered from the UI returns immediately (it only
        # writes a request file), but large .mpp uploads still need room.
        proxy_read_timeout 300s;
    }

    # ---- Health ----------------------------------------------------------
    # Answered by nginx, so it says nothing about the JVM. The container's
    # HEALTHCHECK therefore probes this *and* /api/health - see the
    # Dockerfile.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ---- Everything else --------------------------------------------------
    # `/` is the admin UI's home for convenience; any other unmatched path
    # is a 404 rather than a file read.
    location = / {
        return 302 /admin;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
        return 404;
    }

    location / {
        return 404;
    }
}
